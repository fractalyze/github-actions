name: 'Bzlmod Pin Sync'
description: >-
  Sync a bzlmod git_override commit pin, and the pip pins that must match it,
  onto one force-pushed branch.
author: 'fractalyze'

# The bzlmod sibling of `pin-bump`. That one rewrites `<PREFIX>_COMMIT` and
# `<PREFIX>_SHA256` in a `workspace.bzl`; a bzlmod consumer pins through a
# `git_override` commit and carries a `MODULE.bazel.lock` that only
# `bazel mod deps` can refresh, so the file surgery and the refresh differ
# entirely even though the intent is the same.
#
# The pins move in ONE commit on purpose. An upstream Bazel module resolves its
# own pip dependencies from its own lock, so a consumer that bumps only one side
# puts two copies of the same package on a single test's `sys.path`. Exactly one
# of them is imported — whichever hub the `imports` depset reaches first, which
# BUILD dependency order decides and so differs between targets in one repo. It
# surfaces as a type or dtype error inside an unrelated test rather than as a
# version conflict, which is an expensive thing to debug and a cheap thing to
# prevent.
#
# Which is why the pip half takes a LIST, and why that list is required. Every
# package both hubs resolve is subject to the same hazard, not just the one that
# shares the upstream's release train, and a package left off the list drifts
# silently until something downstream trips on it. An empty list would move the
# commit pin while leaving every pip pin behind, which is the lone-sided bump
# described above, so it is an error rather than a mode.
#
# Each listed package is matched on its own name — the literal prefix `<pkg>==`,
# never a regex — and rewritten to the version upstream carries for that name.
# The version string is never itself used as a search pattern: it is short and
# unanchored (`0.0.1` is a prefix of `0.0.16`, and matches inside a dev
# datestamp such as `0.10.2.dev20260822060712`), so pattern-matching on it
# corrupts unrelated pins in the same file.
#
# One branch, force-pushed. A branch per upstream commit cannot update an open
# PR, so it accumulates one PR per upstream commit, each staler than the last and
# each burning a CI run — with the pin worth merging at the bottom of the list.
# Re-cutting from the checked-out default branch also rebases for free, so the
# open PR cannot rot against it.

inputs:
  upstream_repo:
    description: 'Upstream repository name under fractalyze (e.g. "hash-frx")'
    required: true
  module_name:
    description: 'Bazel module name of the upstream dep (e.g. "hash_frx")'
    required: true
  paired_packages:
    description: >-
      pip packages whose versions must match the upstream repo's own pins, read
      from the upstream `requirements.in` AT the target commit. Newline- or
      comma-separated. Each is matched and rewritten on its own name, so a set
      of packages that share a release train (frx, frxlib, frx-cuda12-pjrt,
      frx-cuda12-plugin) must list every member. Required, and empty is an
      error: a bump that moves the commit pin while leaving the pip pins behind
      is the lone-sided bump this action exists to prevent, so there is no
      configuration that asks for one.
    required: true
  requirements_in:
    description: 'Path to the pip requirements source'
    required: false
    default: 'requirements.in'
  requirements_lock:
    description: 'Path to the compiled pip lock'
    required: false
    default: 'requirements_lock_3_11.txt'
  requirements_update_target:
    description: 'Bazel target that recompiles the pip lock'
    required: false
    default: '//:requirements.update'
  base_branch:
    description: 'Branch the PR targets'
    required: false
    default: 'main'
  github_token:
    description: 'GitHub PAT with repo scope for push and PR creation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Sync the pins onto the bump branch
      id: sync
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        MODULE_NAME: ${{ inputs.module_name }}
        PAIRED_PACKAGES: ${{ inputs.paired_packages }}
        REQUIREMENTS_IN: ${{ inputs.requirements_in }}
        REQUIREMENTS_LOCK: ${{ inputs.requirements_lock }}
        REQUIREMENTS_UPDATE_TARGET: ${{ inputs.requirements_update_target }}
        BASE_BRANCH: ${{ inputs.base_branch }}
      run: |
        set -euo pipefail

        upstream=$(git ls-remote "https://github.com/fractalyze/${UPSTREAM_REPO}.git" \
                     "refs/heads/${BASE_BRANCH}" | cut -f1)
        if [ -z "${upstream}" ]; then
          echo "::error::could not resolve ${UPSTREAM_REPO} ${BASE_BRANCH}"
          exit 1
        fi

        # Exactly one 40-hex commit pin lives in MODULE.bazel (the git_override).
        # Bail rather than guess if that stops being true.
        pinned=$(sed -n 's/^ *commit = "\([0-9a-f]\{40\}\)".*/\1/p' MODULE.bazel)
        if [ "$(printf '%s' "${pinned}" | grep -c .)" != "1" ]; then
          echo "::error::expected exactly one commit pin in MODULE.bazel for ${MODULE_NAME}, found: ${pinned}"
          exit 1
        fi

        packages=$(printf '%s' "${PAIRED_PACKAGES}" | tr ',' '\n' \
                     | tr -d '[:blank:]' | grep -v '^$' || true)
        # `required: true` is advisory on a composite action — the runner does
        # not enforce it — so the check lives here. It also catches a caller
        # still passing the removed `paired_package`: an undeclared input never
        # reaches this script, so it arrives as nothing and would otherwise sync
        # the commit pin alone, silently.
        if [ -z "${packages}" ]; then
          echo "::error::paired_packages is empty. List every pip package both hubs resolve (e.g. frx, frxlib, frx-cuda12-pjrt, frx-cuda12-plugin, zk-dtypes). If you are migrating from the removed 'paired_package' input, this is its replacement."
          exit 1
        fi

        # Read the upstream source ONCE, AT the target commit, so every answer is
        # what this repo must match rather than whatever was published most
        # recently.
        upstream_reqs=$(gh api "repos/fractalyze/${UPSTREAM_REPO}/contents/${REQUIREMENTS_IN}?ref=${upstream}" \
                          --jq '.content' | base64 -d)

        # `<pkg>==` as a literal prefix, so a '.' or '-' in a package name is not
        # a regex metacharacter, and `frx==` never matches `frxlib==`.
        read_pin() {
          awk -v p="$1" 'index($0, p "==") == 1 { print substr($0, length(p) + 3); exit }'
        }

        moves=""
        summary=""
        for pkg in ${packages}; do
          up=$(printf '%s\n' "${upstream_reqs}" | read_pin "${pkg}")
          ours=$(read_pin "${pkg}" < "${REQUIREMENTS_IN}")
          if [ -z "${up}" ] || [ -z "${ours}" ]; then
            echo "::error::could not read the ${pkg} pin (upstream='${up}' ours='${ours}')"
            exit 1
          fi
          summary="${summary}, ${pkg} ${ours}"
          if [ "${ours}" != "${up}" ]; then
            moves="${moves}${pkg} ${ours} ${up}"$'\n'
          fi
        done

        if [ "${pinned}" = "${upstream}" ] && [ -z "${moves}" ]; then
          echo "pins are current (${MODULE_NAME} ${pinned:0:12}${summary})"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        branch="bump/${UPSTREAM_REPO}"
        git checkout -B "${branch}"

        body_pins=""
        if [ "${pinned}" != "${upstream}" ]; then
          sed -i "s/${pinned}/${upstream}/" MODULE.bazel
          # The lock records the resolved module graph, so it moves with the pin;
          # leaving it stale would put the drift in every contributor's next diff.
          bazel mod deps >/dev/null
          git add MODULE.bazel MODULE.bazel.lock
          body_pins="${body_pins}- \`${MODULE_NAME}\` \`git_override\`: \`${pinned:0:12}\` -> \`${upstream:0:12}\`"$'\n'
        fi
        if [ -n "${moves}" ]; then
          while read -r pkg ours up; do
            [ -n "${pkg}" ] || continue
            awk -v p="${pkg}" -v v="${up}" '
              index($0, p "==") == 1 { print p "==" v; next }
              { print }' "${REQUIREMENTS_IN}" > "${REQUIREMENTS_IN}.tmp"
            mv "${REQUIREMENTS_IN}.tmp" "${REQUIREMENTS_IN}"
            body_pins="${body_pins}- \`${pkg}\`: \`${ours}\` -> \`${up}\`, matching ${UPSTREAM_REPO}'s lock"$'\n'
          done <<< "${moves}"
          # Recompile once, after every pin has moved.
          bazel run "${REQUIREMENTS_UPDATE_TARGET}"
          git add "${REQUIREMENTS_IN}" "${REQUIREMENTS_LOCK}"
        fi

        git config user.name 'fractalyze-dev'
        git config user.email 'fractalyze-dev@users.noreply.github.com'
        # See pin-bump: fractal-commit-lint requires a body on non-docs
        # commits, so a bodyless sync cannot merge.
        git commit -F - <<EOF
        build(deps): sync to ${UPSTREAM_REPO} ${upstream:0:12}

        Automated dependency sync to ${UPSTREAM_REPO}@${upstream}.

        Mirrors the pins that repo moved, so this tree resolves the same
        versions it does.
        EOF
        git push --force origin "${branch}"

        {
          echo "changed=true"
          echo "branch=${branch}"
          echo "title=build(deps): sync to ${UPSTREAM_REPO} ${upstream:0:12}"
          echo "body<<PR_BODY_EOF"
          printf '%s\n' \
            "${body_pins}" \
            "Compare: https://github.com/fractalyze/${UPSTREAM_REPO}/compare/${pinned}...${upstream}" \
            "" \
            "The pins move together on purpose: ${UPSTREAM_REPO} resolves its pip dependencies from its own lock, so a lone bump on either side puts two copies of one package on a single test's \`sys.path\`." \
            "" \
            "CI is the review: the dependency guard exercises a real ${UPSTREAM_REPO} computation across the pin, so a break in the layer below fails here rather than inside a consumer." \
            "" \
            "Force-pushed in place as ${UPSTREAM_REPO} moves, so this PR is always the newest pin on the newest ${BASE_BRANCH}."
          echo "PR_BODY_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create or refresh the bump PR
      if: steps.sync.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BRANCH: ${{ steps.sync.outputs.branch }}
        TITLE: ${{ steps.sync.outputs.title }}
        BODY: ${{ steps.sync.outputs.body }}
        BASE_BRANCH: ${{ inputs.base_branch }}
      run: |
        set -euo pipefail

        # A force-push moves an open PR's head but leaves its title and body
        # untouched, and both name the pin.
        existing=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
        if [ -n "${existing}" ]; then
          echo "refreshing PR #${existing}"
          gh pr edit "${existing}" --title "${TITLE}" --body "${BODY}"
        else
          gh pr create --base "${BASE_BRANCH}" --head "${BRANCH}" \
            --title "${TITLE}" --body "${BODY}"
        fi
