name: commit-lint tests

on:
  pull_request:
    paths:
      - 'commit-lint/**'
      - '.github/workflows/commit-lint-tests.yml'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Regression guard: auto/manual modes live entirely in validate.sh. As
      # long as it is byte-identical to the v1.0.0 release, existing consumers
      # (e.g. zkx on scope_mode: auto) cannot be affected by hybrid-mode work.
      - name: validate.sh unchanged vs v1.0.0
        run: |
          git fetch --tags --quiet
          if ! git diff --exit-code v1.0.0 -- commit-lint/scripts/validate.sh; then
            echo "::error::commit-lint/scripts/validate.sh changed vs v1.0.0 — auto/manual modes are no longer provably unchanged."
            exit 1
          fi

      # Functional test for the new hybrid mode.
      - name: hybrid mode (validate_hybrid.sh)
        run: bash commit-lint/tests/test_validate_hybrid.sh
