name: 'Pin Bump'
description: 'Bump upstream dependency commit hash and SHA256 in Bazel pin files'
author: 'fractalyze'

inputs:
  upstream_repo:
    description: 'Upstream repository name (e.g., "zk_dtypes", "prime-ir")'
    required: true
  upstream_commit:
    description: 'Upstream commit hash to bump to'
    required: true
  pin_file:
    description: 'Path to the pin file (e.g., "third_party/zk_dtypes/workspace.bzl")'
    required: true
  var_prefix:
    description: 'Variable name prefix (e.g., "ZK_DTYPES", "PRIME_IR")'
    required: true
  github_token:
    description: 'GitHub PAT with repo scope for push and PR creation'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Compute SHA256 of upstream tarball
      id: sha256
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
      run: |
        TARBALL_URL="https://github.com/fractalyze/${UPSTREAM_REPO}/archive/${UPSTREAM_COMMIT}.tar.gz"
        echo "Downloading tarball: ${TARBALL_URL}"

        SHA256=$(curl -fsSL -H "Authorization: token ${GH_TOKEN}" "${TARBALL_URL}" | sha256sum | cut -d' ' -f1)
        if [ -z "$SHA256" ]; then
          echo "::error::Failed to compute SHA256 for ${TARBALL_URL}"
          exit 1
        fi

        echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
        echo "Computed SHA256: ${SHA256}"

    - name: Create branch and update pin file
      shell: bash
      env:
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
        PIN_FILE: ${{ inputs.pin_file }}
        VAR_PREFIX: ${{ inputs.var_prefix }}
        NEW_SHA256: ${{ steps.sha256.outputs.sha256 }}
      run: |
        BRANCH="chore/bump-${UPSTREAM_REPO}"
        SHORT_HASH="${UPSTREAM_COMMIT:0:12}"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create or reset the branch from current HEAD
        git checkout -B "${BRANCH}"

        # Update commit hash and SHA256 in the pin file
        sed -i "s/${VAR_PREFIX}_COMMIT = \"[a-f0-9]*\"/${VAR_PREFIX}_COMMIT = \"${UPSTREAM_COMMIT}\"/" "${PIN_FILE}"
        sed -i "s/${VAR_PREFIX}_SHA256 = \"[a-f0-9]*\"/${VAR_PREFIX}_SHA256 = \"${NEW_SHA256}\"/" "${PIN_FILE}"

        git add "${PIN_FILE}"
        git commit -m "build: bump ${UPSTREAM_REPO} to ${SHORT_HASH}"
        git push --force origin "${BRANCH}"

    - name: Create or update PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        UPSTREAM_REPO: ${{ inputs.upstream_repo }}
        UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
      run: |
        BRANCH="chore/bump-${UPSTREAM_REPO}"
        SHORT_HASH="${UPSTREAM_COMMIT:0:12}"
        TITLE="build: bump ${UPSTREAM_REPO} to ${SHORT_HASH}"
        BODY="Automated pin bump of \`${UPSTREAM_REPO}\` to [\`${SHORT_HASH}\`](https://github.com/fractalyze/${UPSTREAM_REPO}/commit/${UPSTREAM_COMMIT})."

        # Check if a PR already exists for this branch
        EXISTING_PR=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number' 2>/dev/null || true)

        if [ -n "$EXISTING_PR" ]; then
          echo "Updating existing PR #${EXISTING_PR}"
          gh pr edit "$EXISTING_PR" --title "${TITLE}" --body "${BODY}"
        else
          echo "Creating new PR"
          gh pr create --title "${TITLE}" --body "${BODY}" --head "${BRANCH}" --base main
        fi
