name: 'Commit Lint'
description: 'Validate PR title and commit messages against conventional commit format'
author: 'fractalyze'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  scopes:
    description: 'Space-separated list of allowed scopes (empty = skip scope validation)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate PR title and commit messages
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        INPUT_SCOPES: ${{ inputs.scopes }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/scripts/validate.sh"
