name: 'Knowledge Extractor'
description: 'Extract knowledge from merged PRs and store in knowledge-graph repo'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  knowledge_repo_token:
    description: 'GitHub PAT with write access to knowledge-graph repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.knowledge_repo_token }}

    - name: Extract knowledge with Claude
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        prompt: |
          PR #${{ github.event.pull_request.number }} has been merged.

          ## PR Info
          - Title: ${{ github.event.pull_request.title }}
          - Repo: ${{ github.repository }}
          - Base SHA: ${{ github.event.pull_request.base.sha }}
          - Head SHA: ${{ github.event.pull_request.head.sha }}

          ## Instructions
          Read and follow the rules in `knowledge-graph/.claude/CLAUDE.md`.

          ## Step 1: Get PR Commits
          Run: `git log ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --oneline`
          to see all commits in this PR.

          ## Step 2: Search Existing Knowledge (Efficient!)
          - Read `knowledge-graph/_meta/tag-index.json` and `knowledge-graph/_meta/file-pattern-index.json`
          - Match relevant tags/patterns from the PR changes
          - Load only top 5 related files (max 7 with links)
          - DO NOT read all knowledge files!

          ## Step 3: Process Each Commit
          For each commit:
          1. Run `git show <sha>` to see changes
          2. Extract knowledge (concepts, decisions, pitfalls)
          3. Decide: update existing file or create new
          4. Add [[wikilinks]] to related knowledge
          5. Update `_meta/` indices

          ## Step 4: Commit to knowledge-graph
          After processing:
          1. `cd knowledge-graph`
          2. `git add .`
          3. `git commit -m "knowledge: extract from ${{ github.repository }}#${{ github.event.pull_request.number }}"`
          4. `git push`

          ## Constraints
          - Each knowledge file: max 500 lines
          - Load max 7 knowledge files total
          - Always update indices after changes
        claude_args: "--max-turns 50"
