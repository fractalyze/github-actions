name: 'Knowledge Extractor'
description: 'Extract knowledge from merged PRs and store in knowledge-graph repo'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for Claude Code Action (use secrets.GITHUB_TOKEN)'
    required: true
  knowledge_repo_token:
    description: 'GitHub PAT with write access to knowledge-graph repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.merge_commit_sha }}

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.knowledge_repo_token }}

    - name: Checkout .claude repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/.claude
        path: .claude
        token: ${{ inputs.knowledge_repo_token }}

    - name: Configure git for knowledge-graph
      shell: bash
      run: |
        cd knowledge-graph
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Extract Knowledge
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        # Calculate max turns based on commit count
        COMMIT_COUNT=$(git rev-list --count "$MERGE_SHA^1..$MERGE_SHA" 2>/dev/null || echo "1")
        MAX_TURNS=$((COMMIT_COUNT * 30))

        # Ensure minimum turns
        if [ "$MAX_TURNS" -lt 30 ]; then
          MAX_TURNS=30
        fi

        PR_URL="https://github.com/$REPO/pull/$PR_NUMBER"

        echo "=========================================="
        echo "Extracting knowledge from PR: $PR_URL"
        echo "Commits: $COMMIT_COUNT"
        echo "Max turns: $MAX_TURNS"
        echo "=========================================="

        echo "/extract-knowledge --pr $PR_URL" | claude --print \
          --model claude-sonnet-4-20250514 \
          --max-turns $MAX_TURNS \
          --add-dir .claude \
          --add-dir knowledge-graph \
          --allowedTools "Write,Bash,Edit,Read,Grep,Glob,Skill,Task"

        echo "Knowledge extraction completed!"
