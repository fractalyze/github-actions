name: 'Knowledge Extractor'
description: 'Extract knowledge from merged PRs and store in knowledge-graph repo'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for Claude Code Action (use secrets.GITHUB_TOKEN)'
    required: true
  knowledge_repo_token:
    description: 'GitHub PAT with write access to knowledge-graph repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo (full history)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.merge_commit_sha }}

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.knowledge_repo_token }}

    - name: Configure git for knowledge-graph
      shell: bash
      run: |
        cd knowledge-graph
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Process each commit
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        REPO: ${{ github.repository }}
      run: |
        echo "Fetching PR context..."
        PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')
        PR_COMMENTS=$(gh pr view "$PR_NUMBER" --json comments --jq '[.comments[].body] | join("\n---\n")' | head -c 5000)

        COMMITS=$(git log "$MERGE_SHA^1..$MERGE_SHA" --format="%H" --reverse 2>/dev/null || echo "$MERGE_SHA")
        TOTAL=$(echo "$COMMITS" | wc -l | tr -d ' ')
        CURRENT=0

        for SHA in $COMMITS; do
          CURRENT=$((CURRENT + 1))
          COMMIT_MSG="$(git log -1 --format='%s' "$SHA")"
          SHORT_SHA="${SHA:0:7}"
          COMMIT_MSG_SHORT=$(echo "$COMMIT_MSG" | head -n1)
          REPO_SHORT=$(echo "$REPO" | cut -d'/' -f2)
          echo "=========================================="
          echo "Processing commit $CURRENT/$TOTAL: $SHA"
          echo "Message: $COMMIT_MSG"
          echo "=========================================="

          PROMPT="Commit $SHA has been merged in PR #$PR_NUMBER.

        Commit Info:
        - SHA: $SHA
        - Message: $COMMIT_MSG
        - Repo: $REPO
        - PR: #$PR_NUMBER - $PR_TITLE

        PR Description:
        $PR_BODY

        PR Discussion:
        $PR_COMMENTS

        Instructions:
        Read and follow the rules in knowledge-graph/.claude/CLAUDE.md.

        Step 1: Analyze Commit
        Run: git show $SHA
        to see the changes in this commit.

        Step 2: Search Existing Knowledge (Efficient!)
        - Read knowledge-graph/_meta/tag-index.json and knowledge-graph/_meta/file-pattern-index.json
        - Match relevant tags/patterns from the commit changes
        - Load only top 5 related files (max 7 with links)
        - DO NOT read all knowledge files!

        Step 3: Extract Knowledge
        1. Extract knowledge (concepts, decisions, pitfalls)
        2. Decide: update existing file or create new
        3. Add [[wikilinks]] to related knowledge
        4. Update _meta/ indices

        Step 4: Commit to knowledge-graph
        After processing:
        1. cd knowledge-graph
        2. git add .
        3. git commit -m 'docs($REPO_SHORT): $SHORT_SHA - $COMMIT_MSG_SHORT'
        4. git push

        Constraints:
        - Each knowledge file: max 500 lines
        - Load max 7 knowledge files total
        - Always update indices after changes
        - If no knowledge worth extracting, skip and say so"

          echo "$PROMPT" | claude --print --model claude-opus-4-5-20251101 --max-turns 30 \
            --add-dir knowledge-graph \
            --allowedTools "Write,Bash,Edit"

          echo "Completed commit $CURRENT/$TOTAL"
        done

        echo "All commits processed!"
