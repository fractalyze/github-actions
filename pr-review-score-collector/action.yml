name: 'PR Review Score Collector'
description: 'Collect reactions from pr-reviewer comments and update trust scores'
author: 'fractalyze'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  claude_repo_token:
    description: 'GitHub PAT with write access to .claude repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout .claude repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/.claude
        path: dot-claude
        token: ${{ inputs.claude_repo_token }}

    - name: Configure git
      shell: bash
      run: |
        cd dot-claude
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Collect reactions and update score
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        METRICS_DIR: dot-claude/agents/pr-reviewer/metrics
      run: |
        python ${{ github.action_path }}/scripts/collect.py

    - name: Commit and push
      shell: bash
      run: |
        cd dot-claude
        git add agents/pr-reviewer/metrics/
        git diff --cached --quiet || git commit -m "docs: update pr-reviewer-metric from ${{ github.repository }}#${{ github.event.pull_request.number }}"
        git push
