name: 'Project Tracker'
description: 'Auto-add PRs to fractalyze Roadmap project'
author: 'fractalyze'

inputs:
  project_token:
    description: 'PAT with project and repo scope for org-level project access'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Track PR in project
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.project_token }}
      run: |
        set -euo pipefail

        PROJECT_NUM=6
        ORG="fractalyze"

        EVENT="${{ github.event_name }}"
        if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
          PR_URL="${{ github.event.pull_request.html_url }}"
        else
          echo "Unsupported event: $EVENT"
          exit 0
        fi

        echo "PR: $PR_URL"

        # Add PR to project (idempotent — returns existing item if already added)
        gh project item-add "$PROJECT_NUM" \
          --owner "$ORG" \
          --url "$PR_URL" \
          --format json > /dev/null

        echo "Done: PR added to project"
