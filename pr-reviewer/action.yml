name: 'PR Reviewer'
description: 'Automated PR review using knowledge-graph context'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for posting review comments'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.github_token }}

    - name: Checkout .claude repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/.claude
        path: dot-claude
        token: ${{ inputs.github_token }}

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run PR Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        echo "Fetching PR context..."
        PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')

        # Load skills
        LOAD_KNOWLEDGE_SKILL=$(cat dot-claude/skills/load-knowledge/SKILL.md)
        REVIEW_CHANGES_SKILL=$(cat dot-claude/skills/review-changes/SKILL.md)

        PROMPT="Review PR #$PR_NUMBER in $REPO.

        PR Info:
        - Title: $PR_TITLE
        - Base: $BASE_SHA
        - Head: $HEAD_SHA

        PR Description:
        $PR_BODY

        ---

        # Skills Reference

        ## load-knowledge skill
        $LOAD_KNOWLEDGE_SKILL

        ## review-changes skill
        $REVIEW_CHANGES_SKILL

        ---

        # Instructions

        1. Get diff: git diff $BASE_SHA...$HEAD_SHA
        2. Follow load-knowledge skill to load relevant knowledge from knowledge-graph/
        3. Follow review-changes skill to review the diff

        # Output

        Post review comments using gh CLI:
        - File-specific: gh api repos/$REPO/pulls/$PR_NUMBER/comments -f body='...' -f path='file.cpp' -f line=123 -f side='RIGHT' -f commit_id='$HEAD_SHA'
        - General: gh pr comment $PR_NUMBER --body '...'

        IMPORTANT: Every comment MUST end with:
        <!-- pr-reviewer-bot -->"

        echo "$PROMPT" | claude --print --model claude-sonnet-4-20250514 --max-turns 20 \
          --add-dir knowledge-graph \
          --add-dir dot-claude \
          --allowedTools "Read,Grep,Glob,Bash"

        echo "PR review completed!"
