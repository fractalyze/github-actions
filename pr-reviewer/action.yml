name: 'PR Reviewer'
description: 'Automated PR review using knowledge-graph context with multi-agent architecture'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for posting review comments'
    required: true
  knowledge_repo_token:
    description: 'GitHub PAT with read access to knowledge-graph repo'
    required: true
  claude_repo_token:
    description: 'GitHub PAT with read access to .claude repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.knowledge_repo_token }}

    - name: Checkout .claude repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/.claude
        path: dot-claude
        token: ${{ inputs.claude_repo_token }}

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run PR Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        echo "Fetching PR context..."
        PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')

        # Load skill + references
        PR_REVIEW_SKILL=$(cat dot-claude/skills/pr-review/SKILL.md)
        MULTI_AGENT_PATTERNS=$(cat dot-claude/skills/pr-review/references/multi-agent-patterns.md)
        LOAD_KNOWLEDGE=$(cat dot-claude/skills/load-knowledge/SKILL.md)

        # Load main agent + sub-agents (4 agents)
        MAIN_AGENT=$(cat dot-claude/agents/pr-reviewer/AGENT.md)
        CONVENTION=$(cat dot-claude/agents/pr-reviewer/sub-agents/convention-reviewer.md)
        PITFALL=$(cat dot-claude/agents/pr-reviewer/sub-agents/pitfall-reviewer.md)
        ARCHITECTURE=$(cat dot-claude/agents/pr-reviewer/sub-agents/architecture-reviewer.md)
        PORTING=$(cat dot-claude/agents/pr-reviewer/sub-agents/porting-reviewer.md)

        PROMPT="Review PR #$PR_NUMBER in $REPO.

        # PR Context

        - Title: $PR_TITLE
        - Base: $BASE_SHA
        - Head: $HEAD_SHA
        - Diff command: git diff $BASE_SHA...$HEAD_SHA

        ## PR Description
        $PR_BODY

        ---

        # Main Agent
        $MAIN_AGENT

        ---

        # Workflow (follow this)
        $PR_REVIEW_SKILL

        ---

        # Sub-Agents (spawn with Task tool - 4 agents in parallel)

        ## convention-reviewer
        $CONVENTION

        ## pitfall-reviewer
        $PITFALL

        ## architecture-reviewer
        $ARCHITECTURE

        ## porting-reviewer
        $PORTING

        ---

        # Skills

        ## /load-knowledge
        $LOAD_KNOWLEDGE

        ---

        # References

        ## Multi-Agent Patterns
        $MULTI_AGENT_PATTERNS

        ---

        # Execute

        Follow the PR Review Skill workflow above:
        1. Get diff: git diff $BASE_SHA...$HEAD_SHA
        2. Detect if porting PR (title contains 'port', 'xla', or files from xla/ to zkx/)
        3. Spawn 4 sub-agents in parallel using Task tool
        4. Merge and deduplicate results
        5. Post resolvable line-level comments using GitHub Review API

        IMPORTANT:
        - Every comment MUST include [[wikilink]] to knowledge reference
        - Use resolvable line-level comments (GitHub Review API)
        - If porting PR detected, ensure porting-reviewer provides porting-specific feedback"

        echo "$PROMPT" | claude --print --model claude-sonnet-4-20250514 --max-turns 50 \
          --add-dir knowledge-graph \
          --add-dir dot-claude \
          --allowedTools "Read,Grep,Glob,Bash,Task"

        echo "PR review completed!"
