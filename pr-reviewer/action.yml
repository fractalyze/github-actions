name: 'PR Reviewer'
description: 'Automated PR review using knowledge-graph context with multi-agent architecture'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for posting review comments'
    required: true
  knowledge_repo_token:
    description: 'GitHub PAT with read access to knowledge-graph repo'
    required: true
  claude_repo_token:
    description: 'GitHub PAT with read access to .claude repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout PR branch (for /review comment)
      if: github.event_name == 'issue_comment'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        PR_NUMBER="${{ github.event.issue.number }}"
        PR_HEAD=$(gh pr view $PR_NUMBER --json headRefName -q '.headRefName')
        git fetch origin $PR_HEAD
        git checkout $PR_HEAD

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.knowledge_repo_token }}

    - name: Checkout .claude repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/.claude
        path: .claude
        token: ${{ inputs.claude_repo_token }}

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run PR Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
        PR_URL="https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"

        echo "/review-pr $PR_URL" | claude --print \
          --model claude-sonnet-4-20250514 \
          --max-turns 50 \
          --add-dir .claude \
          --add-dir knowledge-graph \
          --allowedTools "Read,Grep,Glob,Bash,Task,Skill"

        echo "PR review completed!"
