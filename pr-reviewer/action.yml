name: 'PR Reviewer'
description: 'Automated PR review using knowledge-graph context with multi-agent architecture'
author: 'fractalyze'

inputs:
  anthropic_api_key:
    description: 'Anthropic API key for Claude'
    required: true
  github_token:
    description: 'GitHub token for posting review comments'
    required: true
  knowledge_repo_token:
    description: 'GitHub PAT with read access to knowledge-graph repo'
    required: true
  claude_repo_token:
    description: 'GitHub PAT with read access to .claude repo'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout source repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Checkout knowledge-graph repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/knowledge-graph
        path: knowledge-graph
        token: ${{ inputs.knowledge_repo_token }}

    - name: Checkout .claude repo
      uses: actions/checkout@v4
      with:
        repository: fractalyze/.claude
        path: .claude
        token: ${{ inputs.claude_repo_token }}

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run PR Review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        echo "Fetching PR context..."
        PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')

        # Register 4 sub-agents via --agents flag
        # Each agent reads its own instructions from .claude/agents/
        AGENTS_JSON='{
          "convention-reviewer": {
            "description": "Review code from convention perspective",
            "model": "haiku",
            "prompt": "You are convention-reviewer. Read your instructions from .claude/agents/pr-reviewer/sub-agents/convention-reviewer.md and follow them exactly."
          },
          "pitfall-reviewer": {
            "description": "Review code for known pitfalls and bugs",
            "model": "haiku",
            "prompt": "You are pitfall-reviewer. Read your instructions from .claude/agents/pr-reviewer/sub-agents/pitfall-reviewer.md and follow them exactly."
          },
          "architecture-reviewer": {
            "description": "Review code from architecture perspective",
            "model": "sonnet",
            "prompt": "You are architecture-reviewer. Read your instructions from .claude/agents/pr-reviewer/sub-agents/architecture-reviewer.md and follow them exactly."
          },
          "porting-reviewer": {
            "description": "Review XLA to ZKX porting quality",
            "model": "haiku",
            "prompt": "You are porting-reviewer. Read your instructions from .claude/agents/pr-reviewer/sub-agents/porting-reviewer.md and follow them exactly."
          }
        }'

        # Main prompt - short and focused
        PROMPT="Review PR #$PR_NUMBER in $REPO.

        ## PR Context
        - Title: $PR_TITLE
        - Base: $BASE_SHA
        - Head: $HEAD_SHA
        - Diff: git diff $BASE_SHA...$HEAD_SHA

        ## PR Description
        $PR_BODY

        ## Instructions
        1. Read .claude/agents/pr-reviewer/AGENT.md for your role
        2. Read .claude/skills/pr-review/SKILL.md for the workflow
        3. Follow the workflow exactly:
           - Get diff and detect if porting PR
           - Spawn 4 sub-agents in parallel using Task tool
           - Merge and deduplicate results
           - Post resolvable line-level comments via GitHub Review API

        ## Critical Requirements
        - Every comment MUST include [[wikilink]] to knowledge reference
        - Use resolvable line-level comments (GitHub Review API)
        - Max 10 comments, confidence > 80% only"

        echo "$PROMPT" | claude --print \
          --model claude-opus-4-20250514 \
          --max-turns 50 \
          --add-dir .claude \
          --add-dir knowledge-graph \
          --agents "$AGENTS_JSON" \
          --allowedTools "Read,Grep,Glob,Bash,Task"

        echo "PR review completed!"
